
name: Build VYRNTH Dungeons

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract plugin source ZIP
        shell: bash
        run: |
          ZIP="$(find . -type f -name '*.zip' -not -path './.git/*' -print -quit)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::No source ZIP found in repository!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Maven project
        shell: bash
        run: |
          POM="$(find extracted -type f -name pom.xml -print -quit)"

          if [[ -z "$POM" ]]; then
            echo "::error::pom.xml not found inside source ZIP!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build plugin
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Prepare JAR
        shell: bash
        run: |
          JAR="$PROJECT_DIR/target/VyrnthDungeons.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "::error::VyrnthDungeons.jar was not generated!"
            find "$PROJECT_DIR/target" -type f || true
            exit 1
          fi

          mkdir -p output
          cp "$JAR" output/

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VyrnthDungeons
          path: output/VyrnthDungeons.jar
          
