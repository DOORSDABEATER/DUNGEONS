
name: Build VYRNTH Dungeons

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract plugin source ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No source ZIP found!"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Maven project
        run: |
          POM=$(find extracted -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "pom.xml not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build plugin
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Prepare JAR
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/target/VyrnthDungeons.jar" output/

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VyrnthDungeons
          path: output/VyrnthDungeons.jar
          
